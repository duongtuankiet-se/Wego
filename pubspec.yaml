name: exe
description: "WeGo - Demo booking xe ghép khách"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2
  mongo_dart: ^0.10.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.4
  flutter_dotenv: ^5.2.1
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  lottie: ^3.3.0
  sliding_up_panel: ^2.0.0+1
  dart_geohash: ^2.0.2
  google_maps_flutter: ^2.10.0
  flutter_polyline_points: ^2.1.0
  http: ^1.2.2
  phosphor_flutter: ^2.1.0
  carousel_slider: ^5.0.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0

# Local patch of phosphor_flutter 2.1.0 for Flutter 3.44+ — upstream
# 2.1.0 does `class PhosphorIconData extends IconData`, which fails to
# compile now that `IconData` is a `final class`. See scripts/patch_phosphor.py
# for the patch (typedef alias + duotone wrapper rewrite).
dependency_overrides:
  phosphor_flutter:
    path: vendor/phosphor_flutter

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/lottie/
